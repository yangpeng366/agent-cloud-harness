name: Feature request
description: Propose a new capability or engineering improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or gap are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the feature or change you want.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Which area does this affect? API, dialogue UI, control graph, packets, tools, docs, etc.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
