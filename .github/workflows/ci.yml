name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify
        run: mvn -B test

      - name: Check dialogue frontend entry
        run: node --check src/main/resources/web/dialogue/app.js

      - name: Run dialogue frontend smoke tests
        run: node --test src/test/js/*.test.mjs
