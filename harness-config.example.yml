# harness-config.yml — agent-cloud-harness 声明式配置
# 复制为 harness-config.yml 并按需修改。变更后需重启 harness 生效。
# 注意：本文件为脱敏示例，token/密钥/路径均为占位符，请替换为你本机的真实值。
# 详细说明见 docs/FREE_MODEL_WORKER_LANE_PLAN.md
#
# 架构：harness 只用两个 codex CLI lane：
#   codex-main  -> codex -c model_provider=ccx -c model=codex        (主力，CCX 路由到付费渠道)
#   codex-free  -> codex -c model_provider=ccx-free -c model=codex-free (免费，CCX 路由到免费渠道)
#
# CCX 负责模型路由：codex-free 通过各渠道的 modelMapping 映射到实际免费模型
# Harness 不关心 CCX 背后是哪个渠道，只关心 codex / codex-free 两个入口

harness:
  # 全局默认
  defaults:
    provider_model_provider: ccx
    provider_base_url: http://127.0.0.1:3688/v1
    provider_wire_api: chat_completions
    provider_bearer_token: ccx-YOUR_BEARER_TOKEN_HERE

  # CCX 渠道健康检查
  ccx:
    base_url: http://127.0.0.1:3688
    admin_key: ccx-YOUR_ADMIN_KEY_HERE
    health_check_on_startup: true
    channel_sync_on_startup: false

  # 本地工作区别名注册表：provider/codex 可根据任务意图自行定位目标仓库。
  # key 建议使用项目名或用户常说的别名；value 改为你本机真实仓库路径。
  # 示例：任务提到 /myproject/... 时，codex 将 cwd 定位到 /path/to/myproject，
  # 并在 prompt 中看到完整工作区清单和边界提示，避免回退到 harness 自身仓库。
  workspace-aliases:
    myproject: '/path/to/myproject'
    myproject-tmp: '/path/to/myproject-tmp'
  # 声明式 worker lane
  workers:
    # 主力 coding（走 CCX 付费渠道）
    - id: codex-main
      provider: codex
      model_tier: strong
      cost_class: paid_auto
      selection_priority: 100
      capabilities: [chat, code, patch, session]
      profile:
        model: codex
        model_provider: ccx
      metadata:
        primary_role: planner_executor
        execution_backend: provider_app_server
        local_workspace_access: true

    # 免费模型（走 CCX 免费渠道，codex-free -> 硅基/智谱/OpenRouter/GitHub）
    - id: codex-free
      provider: codex
      model_tier: small
      cost_class: free_auto
      selection_priority: 70
      capabilities: [chat, code, session]
      profile:
        model: codex-free
        model_provider: ccx-free
      metadata:
        primary_role: cannon_fodder
        execution_backend: provider_app_server
        local_workspace_access: true

# Judgment Shadow（Provider-agnostic 三件套 + M1/M2/M3 旁路观察 + M4 Calibration 工具链）
# 详见 notes/49 / 50 / 51 号（位于 D:\BaiduSyncdisk\Obsidian Vault\当前项目\02_项目推进\agent-cloud-architecture\notes\）
# 默认 enabled=false；整套 shadow 包不挂 sink；既有路径不变。
# 当 enabled=true + profile=record_only：Router/Tool Gate/Verifier 写 DecisionEvent JSONL；
#                                         WorkerExecutor 既有路径不变；DecisionEventStatsCli 周期回放。
# 当 enabled=true + profile=enforce：Router judgment 决定 worker 候选；Tool Gate 写入类工具按 approval 强制 block；
#                                     Verifier retry_once / handoff 实际生效（按工具种类分批开放）。
judgment:
  shadow:
    enabled: false                  # 默认关
    profile: record_only            # record_only | enforce
    policy_version: default         # 关联 DecisionPolicy.version
    router:
      enabled: true                 # M1 开关（commit e91669b 已接入 WorkerExecutorRouter）
      provider: heuristic-shadow-v1
      path: "/var/log/ach/router-shadow.jsonl"
    tool_gate:
      enabled: false                # M2 集成候选（commit 4a16a19 已落 service，待 WorkerExecutor 接入）
      provider: heuristic-shadow-v1
      path: "/var/log/ach/tool-gate-shadow.jsonl"
    verifier:
      enabled: false                # M3 集成候选（commit debce99 已落 service，待 WorkerExecutor 接入）
      provider: heuristic-shadow-v1
      path: "/var/log/ach/verifier-shadow.jsonl"
    stats:
      enabled: false                # M4 Calibration 周期回放任务（CLI 已落：commit 2a507e5 + de9fdd6）
      cli_command: "java -cp '<ach-classpath>' com.agentcloud.judgment.model.shadow.stats.DecisionEventStatsCli --pretty {path}"